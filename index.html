<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>言绪</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Noto Serif SC', serif;
            overflow-x: hidden;
        }

        .scroll-container {
            height: 100vh;
            overflow-y: auto;
            position: relative;
        }

        .section {
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0;
            transition: opacity 0.8s ease-in-out;
            pointer-events: none;
        }

        .section.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .ink-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0.2) 50%, rgba(0,0,0,0.5) 100%);
        }

        .content-card {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            padding: 60px 80px;
            max-width: 700px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.3);
        }

        .poem-title {
            font-size: 2.5rem;
            font-weight: 600;
            color: #fff;
            margin-bottom: 30px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }

        .poem-content {
            font-size: 1.5rem;
            line-height: 2.2;
            color: rgba(255,255,255,0.95);
            margin-bottom: 30px;
            font-weight: 300;
        }

        .poem-author {
            font-size: 1.25rem;
            color: rgba(255,255,255,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }



        .scroll-indicator {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            color: rgba(255,255,255,0.6);
            font-size: 0.9rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            transition: opacity 0.3s;
        }

        .scroll-indicator.hidden {
            opacity: 0;
        }

        .scroll-indicator i {
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
            60% { transform: translateY(-5px); }
        }

        .nav-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            padding: 20px 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(to bottom, rgba(0,0,0,0.3), transparent);
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 600;
            color: #fff;
            text-decoration: none;
            letter-spacing: 0.1em;
        }

        .section-number {
            position: absolute;
            top: 100px;
            right: 60px;
            font-size: 8rem;
            font-weight: 700;
            color: rgba(255,255,255,0.05);
            z-index: 5;
        }

        .fade-in {
            animation: fadeIn 1s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <nav class="nav-bar">
        <a href="#" class="logo">言绪</a>

    <div class="scroll-indicator" id="scrollIndicator">
        <span>向上滚动</span>
        <i class="fas fa-chevron-up"></i>

    <script>
        const poems = [
            { title: "静夜思", author: "李白", content: "床前明月光，疑是地上霜。举头望明月，低头思故乡。" },
            { title: "登鹳雀楼", author: "王之涣", content: "白日依山尽，黄河入海流。欲穷千里目，更上一层楼。" },
            { title: "游子吟", author: "孟郊", content: "慈母手中线，游子身上衣。临行密密缝，意恐迟迟归。谁言寸草心，报得三春晖。" },
            { title: "清明", author: "杜牧", content: "清明时节雨纷纷，路上行人欲断魂。借问酒家何处有，牧童遥指杏花村。" },
            { title: "相思", author: "王维", content: "红豆生南国，春来发几枝。愿君多采撷，此物最相思。" },
            { title: "九月九日忆山东兄弟", author: "王维", content: "独在异乡为异客，每逢佳节倍思亲。遥知兄弟登高处，遍插茱萸少一人。" },
            { title: "春望", author: "杜甫", content: "国破山河在，城春草木深。感时花溅泪，恨别鸟惊心。烽火连三月，家书抵万金。白头搔更短，浑欲不胜簪。" },
            { title: "月夜忆舍弟", author: "杜甫", content: "戍鼓断人行，秋边一雁声。露从今夜白，月是故乡明。有弟皆分散，无家问死生。寄书长不达，况乃未休兵。" },
            { title: "黄鹤楼送孟浩然之广陵", author: "李白", content: "故人西辞黄鹤楼，烟花三月下扬州。孤帆远影碧空尽，唯见长江天际流。" },
            { title: "送元二使安西", author: "王维", content: "渭城朝雨浥轻尘，客舍青青柳色新。劝君更尽一杯酒，西出阳关无故人。" },
            { title: "枫桥夜泊", author: "张继", content: "月落乌啼霜满天，江枫渔火对愁眠。姑苏城外寒山寺，夜半钟声到客船。" },
            { title: "登高", author: "杜甫", content: "风急天高猿啸哀，渚清沙白鸟飞回。无边落木萧萧下，不尽长江滚滚来。万里悲秋常作客，百年多病独登台。艰难苦恨繁霜鬓，潦倒新停浊酒杯。" },
            { title: "回乡偶书", author: "贺知章", content: "少小离家老大回，乡音无改鬓毛衰。儿童相见不相识，笑问客从何处来。" },
            { title: "次北固山下", author: "王湾", content: "客路青山外，行舟绿水前。潮平两岸阔，风正一帆悬。海日生残夜，江春入旧年。乡书何处达？归雁洛阳边。" },
            { title: "望月怀远", author: "张九龄", content: "海上生明月，天涯共此时。情人怨遥夜，竟夕起相思。灭烛怜光满，披衣觉露滋。不堪盈手赠，还寝梦佳期。" },
            { title: "春江花月夜", author: "张若虚", content: "春江潮水连海平，海上明月共潮生。滟滟随波千万里，何处春江无月明。江流宛转绕芳甸，月照花林皆似霰。空里流霜不觉飞，汀上白沙看不见。江天一色无纤尘，皎皎空中孤月轮。" },
            { title: "登幽州台歌", author: "陈子昂", content: "前不见古人，后不见来者。念天地之悠悠，独怆然而涕下。" },
            { title: "夜雨寄北", author: "李商隐", content: "君问归期未有期，巴山夜雨涨秋池。何当共剪西窗烛，却话巴山夜雨时。" },
            { title: "无题·相见时难别亦难", author: "李商隐", content: "相见时难别亦难，东风无力百花残。春蚕到死丝方尽，蜡炬成灰泪始干。晓镜但愁云鬓改，夜吟应觉月光寒。蓬山此去无多路，青鸟殷勤为探看。" },
            { title: "水调歌头·明月几时有", author: "苏轼", content: "明月几时有？把酒问青天。不知天上宫阙，今夕是何年。我欲乘风归去，又恐琼楼玉宇，高处不胜寒。起舞弄清影，何似在人间。转朱阁，低绮户，照无眠。不应有恨，何事长向别时圆？人有悲欢离合，月有阴晴圆缺，此事古难全。但愿人长久，千里共婵娟。" },
            { title: "声声慢·寻寻觅觅", author: "李清照", content: "寻寻觅觅，冷冷清清，凄凄惨惨戚戚。乍暖还寒时候，最难将息。三杯两盏淡酒，怎敌他、晚来风急！雁过也，正伤心，却是旧时相识。满地黄花堆积，憔悴损，如今有谁堪摘？守着窗儿，独自怎生得黑！梧桐更兼细雨，到黄昏、点点滴滴。这次第，怎一个愁字了得！" },
            { title: "雨霖铃·寒蝉凄切", author: "柳永", content: "寒蝉凄切，对长亭晚，骤雨初歇。都门帐饮无绪，留恋处，兰舟催发。执手相看泪眼，竟无语凝噎。念去去，千里烟波，暮霭沉沉楚天阔。多情自古伤离别，更那堪，冷落清秋节！今宵酒醒何处？杨柳岸，晓风残月。此去经年，应是良辰好景虚设。便纵有千种风情，更与何人说？" },
            { title: "江城子·乙卯正月二十日夜记梦", author: "苏轼", content: "十年生死两茫茫，不思量，自难忘。千里孤坟，无处话凄凉。纵使相逢应不识，尘满面，鬓如霜。夜来幽梦忽还乡，小轩窗，正梳妆。相顾无言，惟有泪千行。料得年年肠断处，明月夜，短松冈。" },
            { title: "青玉案·元夕", author: "辛弃疾", content: "东风夜放花千树，更吹落、星如雨。宝马雕车香满路。凤箫声动，玉壶光转，一夜鱼龙舞。蛾儿雪柳黄金缕，笑语盈盈暗香去。众里寻他千百度，蓦然回首，那人却在，灯火阑珊处。" },
            { title: "一剪梅·红藕香残玉簟秋", author: "李清照", content: "红藕香残玉簟秋。轻解罗裳，独上兰舟。云中谁寄锦书来？雁字回时，月满西楼。花自飘零水自流。一种相思，两处闲愁。此情无计可消除，才下眉头，却上心头。" },
            { title: "蝶恋花·伫倚危楼风细细", author: "柳永", content: "伫倚危楼风细细，望极春愁，黯黯生天际。草色烟光残照里，无言谁会凭阑意。拟把疏狂图一醉，对酒当歌，强乐还无味。衣带渐宽终不悔，为伊消得人憔悴。" },
            { title: "武陵春·风住尘香花已尽", author: "李清照", content: "风住尘香花已尽，日晚倦梳头。物是人非事事休，欲语泪先流。闻说双溪春尚好，也拟泛轻舟。只恐双溪舴艋舟，载不动许多愁。" },
            { title: "钗头凤·红酥手", author: "陆游", content: "红酥手，黄縢酒，满城春色宫墙柳。东风恶，欢情薄。一怀愁绪，几年离索。错、错、错。春如旧，人空瘦，泪痕红浥鲛绡透。桃花落，闲池阁。山盟虽在，锦书难托。莫、莫、莫！" },
            { title: "卜算子·咏梅", author: "陆游", content: "驿外断桥边，寂寞开无主。已是黄昏独自愁，更著风和雨。无意苦争春，一任群芳妒。零落成泥碾作尘，只有香如故。" },
            { title: "满江红·写怀", author: "岳飞", content: "怒发冲冠，凭栏处、潇潇雨歇。抬望眼，仰天长啸，壮怀激烈。三十功名尘与土，八千里路云和月。莫等闲、白了少年头，空悲切！靖康耻，犹未雪。臣子恨，何时灭！驾长车，踏破贺兰山缺。壮志饥餐胡虏肉，笑谈渴饮匈奴血。待从头、收拾旧山河，朝天阙。" },
            { title: "虞美人·听雨", author: "蒋捷", content: "少年听雨歌楼上，红烛昏罗帐。壮年听雨客舟中，江阔云低、断雁叫西风。而今听雨僧庐下，鬓已星星也。悲欢离合总无情，一任阶前、点滴到天明。" },
            { title: "浣溪沙·一曲新词酒一杯", author: "晏殊", content: "一曲新词酒一杯，去年天气旧亭台。夕阳西下几时回？无可奈何花落去，似曾相识燕归来。小园香径独徘徊。" },
            { title: "苏幕遮·碧云天", author: "范仲淹", content: "碧云天，黄叶地，秋色连波，波上寒烟翠。山映斜阳天接水，芳草无情，更在斜阳外。黯乡魂，追旅思，夜夜除非，好梦留人睡。明月楼高休独倚，酒入愁肠，化作相思泪。" },
            { title: "虞美人·春花秋月何时了", author: "李煜", content: "春花秋月何时了？往事知多少。小楼昨夜又东风，故国不堪回首月明中。雕栏玉砌应犹在，只是朱颜改。问君能有几多愁？恰似一江春水向东流。" },
            { title: "相见欢·无言独上西楼", author: "李煜", content: "无言独上西楼，月如钩。寂寞梧桐深院锁清秋。剪不断，理还乱，是离愁。别是一般滋味在心头。林花谢了春红，太匆匆。无奈朝来寒雨晚来风。胭脂泪，相留醉，几时重？自是人生长恨水长东。" },
            { title: "破阵子·为陈同甫赋壮词以寄之", author: "辛弃疾", content: "醉里挑灯看剑，梦回吹角连营。八百里分麾下炙，五十弦翻塞外声，沙场秋点兵。马作的卢飞快，弓如霹雳弦惊。了却君王天下事，赢得生前身后名。可怜白发生！" },
            { title: "永遇乐·京口北固亭怀古", author: "辛弃疾", content: "千古江山，英雄无觅孙仲谋处。舞榭歌台，风流总被雨打风吹去。斜阳草树，寻常巷陌，人道寄奴曾住。想当年，金戈铁马，气吞万里如虎。元嘉草草，封狼居胥，赢得仓皇北顾。四十三年，望中犹记，烽火扬州路。可堪回首，佛狸祠下，一片神鸦社鼓。凭谁问：廉颇老矣，尚能饭否？" },
            { title: "过零丁洋", author: "文天祥", content: "辛苦遭逢起一经，干戈寥落四周星。山河破碎风飘絮，身世浮沉雨打萍。惶恐滩头说惶恐，零丁洋里叹零丁。人生自古谁无死？留取丹心照汗青。" },
            { title: "石灰吟", author: "于谦", content: "千锤万凿出深山，烈火焚烧若等闲。粉骨碎身浑不怕，要留清白在人间。" },
            { title: "临江仙·梦后楼台高锁", author: "晏几道", content: "梦后楼台高锁，酒醒帘幕低垂。去年春恨却来时。落花人独立，微雨燕双飞。记得小蘋初见，两重心字罗衣。琵琶弦上说相思。当时明月在，曾照彩云归。" },
            { title: "沁园春·雪", author: "毛泽东", content: "北国风光，千里冰封，万里雪飘。望长城内外，惟余莽莽；大河上下，顿失滔滔。山舞银蛇，原驰蜡象，欲与天公试比高。须晴日，看红装素裹，分外妖娆。江山如此多娇，引无数英雄竞折腰。惜秦皇汉武，略输文采；唐宗宋祖，稍逊风骚。一代天骄，成吉思汗，只识弯弓射大雕。俱往矣，数风流人物，还看今朝。" },
            { title: "沁园春·长沙", author: "毛泽东", content: "独立寒秋，湘江北去，橘子洲头。看万山红遍，层林尽染；漫江碧透，百舸争流。鹰击长空，鱼翔浅底，万类霜天竞自由。怅寥廓，问苍茫大地，谁主沉浮？携来百侣曾游，忆往昔峥嵘岁月稠。恰同学少年，风华正茂；书生意气，挥斥方遒。指点江山，激扬文字，粪土当年万户侯。曾记否，到中流击水，浪遏飞舟？" },
            { title: "七律·长征", author: "毛泽东", content: "红军不怕远征难，万水千山只等闲。五岭逶迤腾细浪，乌蒙磅礴走泥丸。金沙水拍云崖暖，大渡桥横铁索寒。更喜岷山千里雪，三军过后尽开颜。" },
            { title: "卜算子·咏梅", author: "毛泽东", content: "风雨送春归，飞雪迎春到。已是悬崖百丈冰，犹有花枝俏。俏也不争春，只把春来报。待到山花烂漫时，她在丛中笑。" },
            { title: "忆秦娥·娄山关", author: "毛泽东", content: "西风烈，长空雁叫霜晨月。霜晨月，马蹄声碎，喇叭声咽。雄关漫道真如铁，而今迈步从头越。从头越，苍山如海，残阳如血。" },
            { title: "蝶恋花·答李淑一", author: "毛泽东", content: "我失骄杨君失柳，杨柳轻扬直上重霄九。问讯吴刚何所有，吴刚捧出桂花酒。寂寞嫦娥舒广袖，万里长空且为忠魂舞。忽报人间曾伏虎，泪飞顿作倾盆雨。" },
            { title: "七律·人民解放军占领南京", author: "毛泽东", content: "钟山风雨起苍黄，百万雄师过大江。虎踞龙盘今胜昔，天翻地覆慨而慷。宜将剩勇追穷寇，不可沽名学霸王。天若有情天亦老，人间正道是沧桑。" },
            { title: "清平乐·六盘山", author: "毛泽东", content: "天高云淡，望断南飞雁。不到长城非好汉，屈指行程二万。六盘山上高峰，红旗漫卷西风。今日长缨在手，何时缚住苍龙？" },
            { title: "采桑子·重阳", author: "毛泽东", content: "人生易老天难老，岁岁重阳。今又重阳，战地黄花分外香。一年一度秋风劲，不似春光。胜似春光，寥廓江天万里霜。" },
            { title: "水调歌头·游泳", author: "毛泽东", content: "才饮长沙水，又食武昌鱼。万里长江横渡，极目楚天舒。不管风吹浪打，胜似闲庭信步，今日得宽馀。子在川上曰：逝者如斯夫！风樯动，龟蛇静，起宏图。一桥飞架南北，天堑变通途。更立西江石壁，截断巫山云雨，高峡出平湖。神女应无恙，当惊世界殊。" }
        ];

        const chineseNumbers = ["壹", "贰", "叁", "肆", "伍", "陆", "柒", "捌", "玖", "拾", "拾壹", "拾贰", "拾叁", "拾肆", "拾伍", "拾陆", "拾柒", "拾捌", "拾玖", "贰拾", "贰拾壹", "贰拾贰", "贰拾叁", "贰拾肆", "贰拾伍", "贰拾陆", "贰拾柒", "贰拾捌", "贰拾玖", "叁拾", "叁拾壹", "叁拾贰", "叁拾叁", "叁拾肆", "叁拾伍", "叁拾陆", "叁拾柒", "叁拾捌", "叁拾玖", "肆拾", "肆拾壹", "肆拾贰", "肆拾叁", "肆拾肆", "肆拾伍", "肆拾陆", "肆拾柒", "肆拾捌", "肆拾玖", "伍拾"];

        function getAuthorBackground(author) {
            return `imgs/${author}.jpg`;
        }

        function shuffleArray(array) {
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        function init() {
            const shuffledPoems = shuffleArray(poems);
            const scrollContainer = document.getElementById('scrollContainer');

            shuffledPoems.forEach((poem, index) => {
                const section = document.createElement('section');
                section.className = 'section';
                section.id = `section${index + 1}`;
                section.style.backgroundImage = `url('${getAuthorBackground(poem.author)}')`;

                const sentences = [];
                let current = '';
                for (const char of poem.content) {
                    if ('。？！'.includes(char)) {
                        if (current.trim()) {
                            sentences.push(current.trim() + char);
                        }
                        current = '';
                    } else {
                        current += char;
                    }
                }
                if (current.trim()) {
                    sentences.push(current.trim());
                }
                const content = sentences.join('<br>');

                section.innerHTML = `
                    <div class="ink-overlay"></div>
                    <div class="section-number">${chineseNumbers[index]}</div>
                    <div class="content-card fade-in">
                        <h2 class="poem-title">${poem.title}</h2>
                        <p class="poem-content">${content}</p>
                        <div class="poem-author">
                            <i class="fas fa-user-edit"></i>
                            <span>${poem.author}</span>
                        </div>
                    </div>
                `;
                scrollContainer.appendChild(section);
            });

            initNavigation();
        }

        function initNavigation() {
            const scrollContainer = document.getElementById('scrollContainer');
            const scrollIndicator = document.getElementById('scrollIndicator');
            let sections = document.querySelectorAll('.section');

            let currentSection = 0;
            let isScrolling = false;
            let scrollTimeout;

            function showSection(index) {
                if (index < 0) index = 0;
                if (index >= sections.length) index = sections.length - 1;

                sections.forEach((section, i) => {
                    if (i === index) {
                        section.classList.add('visible');
                    } else {
                        section.classList.remove('visible');
                    }
                });

                currentSection = index;

                if (currentSection === 0) {
                    scrollIndicator.classList.remove('hidden');
                } else {
                    scrollIndicator.classList.add('hidden');
                }
            }

            scrollContainer.addEventListener('wheel', (e) => {
                e.preventDefault();

                if (isScrolling) return;

                isScrolling = true;

                if (e.deltaY > 0) {
                    showSection(currentSection + 1);
                } else {
                    showSection(currentSection - 1);
                }

                clearTimeout(scrollTimeout);
                scrollTimeout = setTimeout(() => {
                    isScrolling = false;
                }, 800);
            }, { passive: false });

            let touchStartY = 0;
            let touchEndY = 0;

            scrollContainer.addEventListener('touchstart', (e) => {
                touchStartY = e.touches[0].clientY;
            }, { passive: true });

            scrollContainer.addEventListener('touchend', (e) => {
                touchEndY = e.changedTouches[0].clientY;

                if (isScrolling) return;

                const diff = touchStartY - touchEndY;

                if (Math.abs(diff) > 50) {
                    isScrolling = true;

                    if (diff > 0) {
                        showSection(currentSection + 1);
                    } else {
                        showSection(currentSection - 1);
                    }

                    clearTimeout(scrollTimeout);
                    scrollTimeout = setTimeout(() => {
                        isScrolling = false;
                    }, 800);
                }
            }, { passive: true });

            scrollIndicator.addEventListener('click', () => {
                showSection(0);
            });

            document.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') {
                    showSection(currentSection - 1);
                } else if (e.key === 'ArrowDown' || e.key === 'ArrowRight') {
                    showSection(currentSection + 1);
                }
            });

            showSection(0);
        }

        init();
    </script>
</body>
